name: gscores

services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: gscores
      POSTGRES_USER: gscores
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  app:
    image: gscores:local
    build: .
    environment:
      GSCORES_DB_URL: jdbc:postgresql://db:5432/gscores
      GSCORES_DB_USER: gscores
      GSCORES_DB_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GSCORES_HTTP_PORT:-8082}:8080"
    restart: unless-stopped

  seed:
    image: gscores:local
    profiles: [tools]
    command: ["--spring.profiles.active=seed"]
    environment:
      GSCORES_DB_URL: jdbc:postgresql://db:5432/gscores
      GSCORES_DB_USER: gscores
      GSCORES_DB_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      GSCORES_CSV: /dataset/diem_thi_thpt_2024.csv
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./dataset/diem_thi_thpt_2024.csv
        target: /dataset/diem_thi_thpt_2024.csv
        read_only: true
        bind:
          create_host_path: false

volumes:
  postgres_data:
