<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('Top 10 khối A')}"></head>
<body>
<header th:replace="~{fragments/shell :: header('top')}"></header>
<main class="shell">
    <p class="eyebrow">KỲ THI TỐT NGHIỆP THPT 2024</p>
    <h1>Top 10 khối A</h1>
    <p class="intro">Xếp hạng theo tổng điểm Toán, Vật lí và Hóa học.</p>
    <section class="card table-wrap" aria-label="Bảng xếp hạng khối A">
        <p th:if="${ranking.isEmpty()}">Chưa có dữ liệu xếp hạng.</p>
        <table th:unless="${ranking.isEmpty()}">
            <thead>
            <tr>
                <th scope="col">Hạng</th><th scope="col">SBD</th><th scope="col">Toán</th>
                <th scope="col">Vật lí</th><th scope="col">Hóa học</th><th scope="col">Tổng</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row, status : ${ranking}">
                <th scope="row" th:text="${status.count}"></th>
                <td th:text="${row.sbd}"></td>
                <td th:text="${row.toan}"></td>
                <td th:text="${row.vatLi}"></td>
                <td th:text="${row.hoaHoc}"></td>
                <td><strong th:text="${row.total}"></strong></td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
